name: Build iOS 16.6 DEB Package
on: 
  push:  # 代码推送时自动执行；也可改为 schedule / workflow_dispatch 等
    branches: [ main ]  # 仅主分支触发，按需修改分支名

jobs:
  build-deb:
    runs-on: macos-14  # 必须用 macOS Runner，确保支持 Xcode/iOS SDK

    steps:
    # ────────────────────────── 1. 拉取代码 ──────────────────────────
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # ────────────────────────── 2. 安装匹配 iOS 16.6 的 Xcode ──────────────────────────
    - name: Setup Xcode
      uses: actions/setup-xcode@v3
      with:
        xcode-version: '15.0'  # Xcode 15 支持 iOS 16 全系，可根据需求改 15.1/15.2 等

    # ────────────────────────── 3. 安装编译/打包依赖 ──────────────────────────
    - name: Install Dependencies
      run: |
        brew update  # 更新 Homebrew 仓库
        brew install dpkg ldid  # dpkg（打包 DEB）、ldid（iOS 签名）

    # ────────────────────────── 4. 编译源码（示例：Makefile 编译） ──────────────────────────
    - name: Compile Source Code
      run: |
        make  # 🔴 替换为你的编译命令！例如：make ARCH=arm64 或 xcodebuild -workspace YourProject.xcworkspace ...

    # ────────────────────────── 5. 打包 DEB 文件（Tweak 场景示例） ──────────────────────────
    - name: Package DEB File
      run: |
        # ① 创建 DEBIAN 目录 + 控制文件（描述包信息）
        mkdir -p mytweak/DEBIAN  # 🔴 替换 mytweak 为你的包名！
        cat > mytweak/DEBIAN/control <<EOF
        Package: mytweak
        Version: 1.0
        Architecture: arm64  # iOS 设备为 arm64，模拟器为 x86_64
        Maintainer: YourName <you@example.com>  # 🔴 替换为你的信息
        Description: A tweak for iOS 16.6  # 🔴 替换为包描述
        Depends: mobilesubstrate  # Tweak 依赖 MobileSubstrate，必写
        EOF

        # ② 复制编译产物到 DEB 结构（🔴 替换为你实际的编译产物路径！）
        mkdir -p mytweak/Library/MobileSubstrate/DynamicLibraries/
        cp ./build/libmytweak.dylib mytweak/Library/MobileSubstrate/DynamicLibraries/  # 🔴 替换 libmytweak.dylib 和路径

        # ③ 生成 DEB 包
        dpkg-deb --build mytweak
        mv mytweak.deb mytweak-ios16.6.deb  # 重命名 DEB 文件（可选）

        # ④ 打印 DEB 信息（Debug 用）
        echo "生成的 DEB 文件："
        ls -lh mytweak-ios16.6.deb
